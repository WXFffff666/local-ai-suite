name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    continue-on-error: ${{ matrix.platform == 'macos-latest' }}
    name: Build ${{ matrix.platform }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 9.x
        uses: pnpm/action-setup@v4
        with:
          version: 9.x

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm

      - name: Validate workflows with actionlint
        shell: bash
        run: |
          # 官方安装脚本（runner 未必有 Go，不能用 go install 兜底）
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -version
          ./actionlint .github/workflows/release.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Build and publish (Windows/macOS)
        if: matrix.platform != 'linux'
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            pnpm exec electron-builder --publish always
          else
            pnpm exec electron-builder --publish never
          fi

      - name: Build and publish (Linux with xvfb)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            xvfb-run -a pnpm exec electron-builder --publish always
          else
            xvfb-run -a pnpm exec electron-builder --publish never
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalAISuite-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*
            !release/.cache
          if-no-files-found: warn
          retention-days: 14
