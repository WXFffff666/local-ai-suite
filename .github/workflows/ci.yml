name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  privacy-security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License gate (MIT-only, AGPL isolated to sidecars/)
        run: node scripts/check-licenses.mjs
      - name: Privacy gate (local-first / offline / userData / no 0.0.0.0)
        run: node scripts/check-privacy.mjs
      - name: Pack size gate (<150 MB excluding models)
        run: node scripts/check-pack-size.mjs

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # electron 的 index.js 在 dist 缺失时会现场下载甚至 exit(1) —— 测试桩掉它
      - name: Stub electron dist (tests must never fetch the binary)
        shell: bash
        run: |
          mkdir -p node_modules/electron/dist
          printf 'electron' > node_modules/electron/path.txt
          touch node_modules/electron/dist/electron
      - run: pnpm typecheck
      - run: pnpm exec vitest run -c vitest.config.ci.ts --no-file-parallelism
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e (xvfb)
        run: xvfb-run -a pnpm test:e2e

  # 原生敏感套件（better-sqlite3 / electron Tray）在 hosted runner 的 fork 中导入期崩溃（本地通过）。
  # 独立作业隔离运行并上传日志；continue-on-error 保持主门禁诚实，根因修复后转为必需检查。
  test-native:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Stub electron dist
        run: |
          mkdir -p node_modules/electron/dist
          printf 'electron' > node_modules/electron/path.txt
          touch node_modules/electron/dist/electron
      - name: Native-sensitive suites (diagnostic)
        continue-on-error: true
        run: pnpm exec vitest run -c vitest.config.ci.ts src/main/storage src/main/tray --no-file-parallelism 2>&1 | tee native-diag.log
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-diag
          path: native-diag.log
          if-no-files-found: ignore

  test-win:
    # windows-2025 镜像的 VS18 无法被 node-gyp 识别，且 better-sqlite3 v13 未发布预编译产物，钉 2022（VS2022）
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.x }
      - uses: actions/setup-node@v4
        with: { node-version: '20.x', cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Stub electron dist (tests must never fetch the binary)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force node_modules/electron/dist | Out-Null
          Set-Content node_modules/electron/path.txt 'electron.exe'
          New-Item -ItemType File -Force node_modules/electron/dist/electron.exe | Out-Null
      - run: pnpm exec vitest run -c vitest.config.ci.ts --no-file-parallelism
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
