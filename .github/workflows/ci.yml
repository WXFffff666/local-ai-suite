name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  privacy-security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License gate (MIT-only, AGPL isolated to sidecars/)
        run: node scripts/check-licenses.mjs
      - name: Privacy gate (local-first / offline / userData / no 0.0.0.0)
        run: node scripts/check-privacy.mjs
      - name: Pack size gate (<150 MB excluding models)
        run: node scripts/check-pack-size.mjs

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # 诊断步（不挡门禁）：原生模块套件在 hosted runner 上曾使 worker 直接退出，
      # 单独跑一次以捕获其 stderr —— 修复后可移除
      - name: Diagnose storage suite (non-blocking)
        continue-on-error: true
        run: pnpm exec vitest run -c vitest.config.ci.ts src/main/storage --no-file-parallelism 2>&1 | tee storage-diag.log
      - run: pnpm exec vitest run -c vitest.config.ci.ts --no-file-parallelism
      - name: Upload storage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-diag
          path: storage-diag.log
          if-no-files-found: ignore
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e (xvfb)
        run: xvfb-run -a pnpm test:e2e

  test-win:
    # windows-2025 镜像的 VS18 无法被 node-gyp 识别，且 better-sqlite3 v13 未发布预编译产物，钉 2022（VS2022）
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.x }
      - uses: actions/setup-node@v4
        with: { node-version: '20.x', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run -c vitest.config.ci.ts --no-file-parallelism
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
