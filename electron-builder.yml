appId: com.localaisuite.app
productName: Local AI Suite
copyright: Copyright (c) 2026 WXFffff666

directories:
  output: release
  buildResources: build

# ---- pack size optimization ----
asar: true
# Minimal unpack set: only native binaries that the loader must see on the
# real filesystem. Engine EXEs are NOT part of this list — they ship via
# extraResources below (never inside app.asar), so no unpack rules needed.
asarUnpack:
  - "**/*.node"
  - "**/*.dll"
  - "**/*.so"

compression: maximum
# npmRebuild stays TRUE for CI (runners have VS Build Tools and need the
# electron-targeted native rebuild). Local Windows laptops without VS use the
# `pack:local` escape hatch (--config.npmRebuild=false): node_modules already
# carries electron-matched prebuilds from the postinstall `install-app-deps`.
# Cross-check todo33 (CI v2): verify job runs rebuild:native before build.
npmRebuild: true
buildDependenciesFromSource: false
# Per-platform native rebuild: better-sqlite3 / sqlite-vec / sharp are listed
# in pnpm.onlyBuiltDependencies and rebuilt via `electron-builder install-app-deps`
# or `pnpm rebuild` on the target OS. Only the current platform's
# prebuilds (e.g. sqlite-vec-windows-x64 on Win) are packed; other
# platform binaries are excluded via files whitelist below.
nodeGypRebuild: false
electronCompile: false

files:
  - out/**/*
  - package.json
  # --- strict whitelist: exclude docs / tests / maps / caches / models ---
  - "!**/*.ts"
  - "!**/*.map"
  - "!**/*.md"
  - "!**/LICENSE*"
  - "!**/LICENCE*"
  - "!**/README*"
  - "!**/CHANGELOG*"
  - "!**/.git/**"
  - "!**/.github/**"
  - "!**/docs/**"
  - "!**/coverage/**"
  - "!**/.omo/**"
  - "!**/test/**"
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!**/example/**"
  - "!**/examples/**"
  - "!**/__mocks__/**"
  - "!**/.cache/**"
  - "!node_modules/.cache/**"
  - "!node_modules/.bin/**"
  - "!**/*.pdb"
  - "!**/*.lib"
  - "!**/*.exp"
  - "!**/*.o"
  - "!**/*.a"
  # never pack local models (large weights) — downloaded to userData/models at runtime
  - "!models/**"
  - "!**/*.gguf"
  - "!**/*.bin"
  - "!**/*.safetensors"
  - "!**/*.onnx"
  - "!**/*.pt"
  - "!**/*.ckpt"
  - "!release/**"
  - "!out/**/*.ts"
  # exclude other-platform prebuilds when packing on Windows (keep win-x64 only)
  # these patterns are no-ops on the target platform but trim cross-platform fat when present
  - "!node_modules/sqlite-vec-darwin-*/**"
  - "!node_modules/sqlite-vec-linux-*/**"
  - "!node_modules/sharp/vendor/**"
  - "!node_modules/@sharp/**"
  - "!node_modules/sharp-libvips*/**"

extraMetadata:
  main: out/main/index.js

# ---- engine binaries (todo34 owns CI staging; block stays commented locally) ----
# electron-builder fails the build when `from` is missing, so this is a
# placeholder until the CI build job stages the pinned CPU binaries.
# Expected on-disk staging layout (repo root, consumed as-is):
#   build/engines/llama-server.exe    llama.cpp CPU build (manifest.cpu.file)
#   build/engines/sd-cli.exe          stable-diffusion.cpp CPU build
#   build/engines/manifest.json       todo30 SHA256+minVersion manifest (src/engines/manifest.ts;
#                                     file name = manifest.json — resolver reads
#                                     <resourcesPath>/engines/manifest.json, see manifest.ts defaultManifestCandidates)
#   build/engines/whisper-server.exe  OPTIONAL — added by todo36 (speech), manifest key "whisper"
# Copied verbatim into <app>/resources/engines/ — i.e. OUTSIDE app.asar, which is
# what src/engines/resolver.ts requires (process.resourcesPath/engines/<file>, sha256-verified).
# GPU packs are deliberately NOT here: extraResources is not differentially
# updated (R4 #7781), so GPU variants download to userData/engines at runtime.
# extraResources:
#   - from: build/engines
#     to: engines
#     filter: ["**/*"]

publish:
  provider: github
  releaseType: draft
  # todo32: client-side auto-update feed ON (electron-updater reads
  # latest.yml from the draft Release). tag push still creates a draft
  # Release only — publish semantics unchanged, humans promote it.
  publishAutoUpdate: true
  # Gradual rollout: only 10% of installs see the update initially.
  # stagingPercentage is written into latest.yml and enforced CLIENT-side
  # (machine-id hash) — provider-agnostic (Appendix A row 32).
  # SPIKE-PENDING-FINAL (src/main/updater.ts header): draft visibility from
  # the client is UNVERIFIED (plan R3b). Assert at tag v0.1.0; if drafts are
  # invisible, switch releaseType to prerelease + ship with
  # LAS_UPDATE_CHANNEL=beta fallback; if stagingPercentage is absent from the
  # yml, this block gets edited (no app-code change).
  # EDITED per that clause: electron-builder 26.15.3's publish schema has NO
  # stagingPercentage key (scheme.json: 0 occurrences) — keeping it fails
  # schema validation and breaks every build. Staged rollout is therefore a
  # RELEASE-time concern (promote draft manually at 10%/50%/100% cadence),
  # not a build-config key. See src/main/updater.ts header for the spike note.

# ---- packaging hooks (todo31) ----
# afterPack: flip Electron fuses on the win-unpacked EXE ONLY (prod path).
# The dev/e2e app (out/ + node_modules electron binary launched by Playwright
# _electron.launch) never passes through here — that is the dual-build split:
# PROD fused dist/ vs TEST unfused dev launch (plan R3b).
afterPack: ./scripts/fuses.mjs
# afterAllArtifactBuild: artifact hygiene inventory (todo31; engine-staging
# presence check feeds todo34's manifest generation).
afterAllArtifactBuild: ./scripts/pack-after-all.mjs

# Windows — primary target, budget <150 MB (without models)
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable   # single-exe green edition (todo31)
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # reduce installer overhead
  differentialPackage: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
  # The portable exe self-extracts the win-unpacked dir (whose Electron binary
  # afterPack already flipped) to a temp folder at run time, so the same fuse
  # matrix applies to the portable artifact — no extra handling needed here.

# macOS — CSC_LINK / APPLE_ID via env secrets (placeholder, no hard-coded key)
mac:
  target:
    # arm64 需原生 runner/通用二进制链；x64 runner 交叉打包 arm64 会因原生模块架构不符而失败
    - target: dmg
      arch: [x64]
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  sign: false

# Linux
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icons/512x512.png
  category: Utility

# Native rebuild per platform:
#   pnpm rebuild better-sqlite3 sqlite-vec sharp   # or: pnpm exec electron-builder install-app-deps
# CI matrix runs this on each OS before `electron-builder --publish ...`
# so only the matching sqlite-vec-*/sharp binary is present in node_modules.

# Avoid publishing on local `pnpm exec electron-builder` without --publish flag
# CI uses --publish always which overrides this; draft Release created on tag push v*
